    <script>
      // Apply the stored theme before first paint so a light-mode user never
      // sees a dark flash. Mirrors themeClass() in src/store/appStore.ts.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (!stored) {
            stored = localStorage.getItem('darkMode') === 'true' ? 'dark' : 'light';
          }
          var root = document.documentElement;
          if (stored === 'light') root.classList.add('light-theme');
          else if (stored === 'crimson') root.classList.add('light-theme', 'theme-crimson');
          else if (stored === 'aurora') root.classList.add('theme-aurora');
        } catch (e) {
          /* private mode / storage disabled: keep the default light theme */
        }
      })();
    </script>
